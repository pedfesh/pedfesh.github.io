<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Back to Daybook</title>
<style>
  :root{--bg:#FBEFF4;--card:#FFF8FB;--line:#F0D3E0;--fg:#3A1430;--muted:#7D5A6F;--accent:#C2185B}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Roboto,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
  main{box-sizing:border-box;width:100%;max-width:440px;padding:24px 16px;display:flex;flex-direction:column;gap:14px}
  h1{font:400 34px/1.1 Georgia,"Noto Serif",serif;margin:0}h1 em{color:var(--accent)}
  .btn{display:block;text-align:center;text-decoration:none;background:var(--accent);color:#fff;font-weight:600;border-radius:12px;padding:14px;border:0;font-size:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
  code{display:block;word-break:break-all;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
  .ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--muted);font-size:14px}
  .sub{color:var(--muted);font-size:14px;margin:0}
</style>
</head>
<body>
<main>
  <h1>Back to <em>Daybook</em></h1>
  <p id="msg">Taking you back to Daybook…</p>
  <a id="go" class="btn" href="#">Open Daybook</a>
  <div id="manual" class="card" hidden>
    <p class="sub">If Daybook didn't open, copy this code, then in Daybook go to My Tesla, Tesla connection, “Paste the code”. It only works for a few minutes.</p>
    <code id="code"></code>
    <button id="copy" class="ghost" type="button">Copy code</button>
  </div>
</main>
<script>
  var q = new URLSearchParams(location.search), code = q.get("code"), err = q.get("error"), qs = location.search.slice(1);
  var el = function (id) { return document.getElementById(id); };
  var link = /Android/i.test(navigator.userAgent) ? "intent://tesla?" + qs + "#Intent;scheme=daybook;package=uk.fetcham.daybook;end" : "daybook://tesla?" + qs;
  el("go").href = link;
  if (err) { el("msg").textContent = "Tesla sign-in didn't finish (" + (q.get("error_description") || err) + "). Tap below to go back to Daybook, then try again."; }
  else if (!code) { el("msg").textContent = "This page is only used when Daybook signs in to Tesla."; el("go").hidden = true; }
  else { el("code").textContent = code; el("manual").hidden = false; setTimeout(function () { location.href = link; }, 400); }
  el("copy").onclick = function () { if (navigator.clipboard) navigator.clipboard.writeText(code || "").then(function () { el("copy").textContent = "Copied"; }); };
</script>
</body>
</html>
